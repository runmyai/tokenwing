name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tools:
    name: python-tools
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release scripts and run expert tool tests
        run: |
          python -m pip install --no-cache-dir numpy pyyaml tqdm requests
          python -m py_compile tokenwing-tools/release/*.py
          bash -n tokenwing-tools/release/build_linux.sh
          python tokenwing-tools/experts/test_make_model_file.py

  cpp-core:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-22.04
            platform: linux
          - id: linux-arm64
            os: ubuntu-22.04-arm
            platform: linux
          - id: windows-x64
            os: windows-2022
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake file ninja-build pkg-config

      - name: Ensure Ninja is installed (Windows)
        if: matrix.platform == 'windows'
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Build and run core CTest suite
        run: python tokenwing-tools/release/run_ci.py
