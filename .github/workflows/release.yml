name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
      prerelease:
        description: Mark GitHub release as prerelease
        required: false
        type: boolean
        default: false
      publish:
        description: Create or update the GitHub Release (set false for dry-run artifacts only)
        required: false
        type: boolean
        default: true
      from_run:
        description: Reuse the 13 packages of this earlier run (its id) instead of building them again
        required: false
        default: ''
      variants:
        description: With from_run, build only these packages again (names separated by spaces, e.g. tokenwing-linux-x64-rocm)
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # a tiny model for the release check (a 32-token reply from every package that can run here)
  SMOKE_MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf

jobs:
  plan:
    name: packages to build
    runs-on: ubuntu-22.04
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - name: Pick the packages
        id: pick
        env:
          FROM_RUN: ${{ inputs.from_run }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          linux, windows = json.loads(os.environ["LINUX"]), json.loads(os.environ["WINDOWS"])
          known = {m["variant"] for m in linux + windows}
          want = os.environ["VARIANTS"].replace(",", " ").split()
          if want and not os.environ["FROM_RUN"]:
              sys.exit("variants needs from_run: the other packages come from that run")
          if set(want) - known:
              sys.exit(f"unknown packages: {sorted(set(want) - known)}")
          if os.environ["FROM_RUN"]:
              linux = [m for m in linux if m["variant"] in want]
              windows = [m for m in windows if m["variant"] in want]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"linux={json.dumps(linux)}\nwindows={json.dumps(windows)}\nany={str(bool(linux or windows)).lower()}\n")
          print("build:", [m["variant"] for m in linux + windows] or "nothing (all from run " + os.environ["FROM_RUN"] + ")")
          PY
    env:
      LINUX: >-
        [
        {"variant": "tokenwing-linux-x64-cpu", "os": "ubuntu-22.04", "backend": "cpu", "image": "", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-x64-cuda12", "os": "ubuntu-22.04", "backend": "cuda", "image": "nvidia/cuda:12.8.1-devel-ubuntu22.04", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-x64-cuda13", "os": "ubuntu-22.04", "backend": "cuda", "image": "nvidia/cuda:13.4.1-devel-ubuntu22.04", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-x64-rocm", "os": "ubuntu-22.04", "backend": "rocm", "image": "rocm/dev-ubuntu-22.04:7.2.1", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-x64-vulkan", "os": "ubuntu-22.04", "backend": "vulkan", "image": "", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-arm64-cpu", "os": "ubuntu-22.04-arm", "backend": "cpu", "image": "", "smoke": "--smoke"},
        {"variant": "tokenwing-linux-arm64-cuda13", "os": "ubuntu-22.04-arm", "backend": "cuda", "image": "nvidia/cuda:13.4.1-devel-ubuntu22.04", "smoke": "--smoke"}
        ]
      WINDOWS: >-
        [
        {"variant": "tokenwing-windows-x64-cpu", "backend": "cpu", "cuda_version": "", "smoke": "--smoke"},
        {"variant": "tokenwing-windows-x64-cuda12", "backend": "cuda12", "cuda_version": "12.8.1", "smoke": "--smoke"},
        {"variant": "tokenwing-windows-x64-cuda13", "backend": "cuda13", "cuda_version": "13.4.1", "smoke": "--smoke"},
        {"variant": "tokenwing-windows-x64-vulkan", "backend": "vulkan", "cuda_version": "", "smoke": "--smoke"},
        {"variant": "tokenwing-windows-x64-hip", "backend": "hip", "cuda_version": "", "smoke": "--smoke"},
        {"variant": "tokenwing-windows-arm64-cpu", "backend": "arm64-cpu", "cuda_version": "", "smoke": ""}
        ]

  ui:
    name: web page
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the web page once for every package
        working-directory: tools/ui
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          grep -q TokenWing dist/manifest.webmanifest

      - name: Upload the web page
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: tools/ui/dist
          if-no-files-found: error

  build-linux:
    name: ${{ matrix.variant }}
    needs: [plan, ui]
    if: ${{ needs.plan.outputs.linux != '[]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the web page
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: tools/ui/dist

      - name: Download the release-check model
        run: |
          mkdir -p smoke
          curl -fsSL -o smoke/model.gguf "$SMOKE_MODEL_URL"

      - name: Reclaim runner disk space for container build
        if: matrix.image != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Install native host build dependencies
        if: matrix.image == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file git ninja-build pkg-config python3 xz-utils

      - name: Setup Vulkan SDK 1.4.363.1 (Linux)
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get install -y --no-install-recommends libvulkan1 libvulkan-dev
          curl -fsSL -o /tmp/vulkansdk.tar.xz \
            https://sdk.lunarg.com/sdk/download/1.4.363.1/linux/vulkansdk-linux-x86_64-1.4.363.1.tar.xz
          mkdir -p /tmp/vulkansdk
          tar -xf /tmp/vulkansdk.tar.xz -C /tmp/vulkansdk
          rm -f /tmp/vulkansdk.tar.xz
          echo "VULKAN_SDK=/tmp/vulkansdk/1.4.363.1/x86_64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/vulkansdk/1.4.363.1/x86_64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "/tmp/vulkansdk/1.4.363.1/x86_64/bin" >> "$GITHUB_PATH"

      - name: Build native Linux release archive
        if: matrix.image == ''
        env:
          SMOKE_MODEL: ${{ github.workspace }}/smoke/model.gguf
        run: >-
          ./tokenwing-tools/release/build_linux.sh
          --variant "${{ matrix.variant }}"
          --backend "${{ matrix.backend }}"
          --out-dir dist
          ${{ matrix.smoke }}

      - name: Build containerized Linux release archive
        if: matrix.image != ''
        env:
          EXTRA_APT: ${{ matrix.backend == 'rocm' && 'rocblas-dev hipblas-dev' || '' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e SMOKE_MODEL=/src/smoke/model.gguf \
            "${{ matrix.image }}" \
            bash -lc "
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates cmake curl file git ninja-build pkg-config python3 xz-utils ${EXTRA_APT}
              git config --global --add safe.directory /src
              ./tokenwing-tools/release/build_linux.sh \
                --variant '${{ matrix.variant }}' \
                --backend '${{ matrix.backend }}' \
                --out-dir dist \
                ${{ matrix.smoke }}
            "

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.variant }}
          path: dist/${{ matrix.variant }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: ${{ matrix.variant }}
    needs: [plan, ui]
    if: ${{ needs.plan.outputs.windows != '[]' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the web page
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: tools/ui/dist

      - name: Download the release-check model
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Invoke-WebRequest -Uri $env:SMOKE_MODEL_URL -OutFile smoke/model.gguf

      - name: Ensure Ninja is installed
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Setup CUDA toolkit redistributables
        if: startsWith(matrix.backend, 'cuda')
        run: >-
          python tokenwing-tools/release/cuda_redist.py
          --version "${{ matrix.cuda_version }}"
          --dest "${{ runner.temp }}\cuda-${{ matrix.cuda_version }}"

      - name: Setup Vulkan SDK 1.4.363.1 (Windows)
        if: matrix.backend == 'vulkan'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "vulkansdk-1.4.363.1.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.363.1/windows/vulkansdk-windows-X64-1.4.363.1.exe" -OutFile $exe
          $proc = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            "--root", "C:\VulkanSDK\1.4.363.1",
            "--accept-licenses",
            "--default-answer",
            "--confirm-command",
            "install"
          )
          Remove-Item -Force $exe -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

      - name: Setup ROCm Windows SDK 10.0.0
        if: matrix.backend == 'hip'
        run: |
          foreach ($unused in @("C:\ghcup", "C:\Android")) {
            if (Test-Path $unused) { Remove-Item -Recurse -Force $unused -ErrorAction SilentlyContinue }
          }
          python -m pip install --no-cache-dir `
            --index-url https://stable.repo.amd.com/rocm/whl-next/ `
            "rocm[libraries,devel,device-gfx1030,device-gfx1100,device-gfx1101,device-gfx1102,device-gfx1150,device-gfx1151,device-gfx1200,device-gfx1201]==10.0.0"

      - name: Setup llvm-mingw ARM64 cross-compiler
        if: matrix.backend == 'arm64-cpu'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $dst = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Remove-Item -Force $zip -ErrorAction SilentlyContinue

      - name: Build and package Windows release archive
        env:
          SMOKE_MODEL: ${{ github.workspace }}\smoke\model.gguf
        run: |
          $extra = @()
          if ("${{ matrix.backend }}" -like "cuda*") {
            $extra += @("--cuda-root", "${{ runner.temp }}\cuda-${{ matrix.cuda_version }}")
          } elseif ("${{ matrix.backend }}" -eq "vulkan") {
            $extra += @("--vulkan-sdk", "C:\VulkanSDK\1.4.363.1")
          } elseif ("${{ matrix.backend }}" -eq "arm64-cpu") {
            $base = Join-Path $env:RUNNER_TEMP "llvm-mingw"
            $root = Get-ChildItem $base -Directory | Select-Object -First 1 -ExpandProperty FullName
            $extra += @("--mingw-root", $root)
          }
          if ("${{ matrix.smoke }}" -ne "") {
            $extra += "${{ matrix.smoke }}"
          }
          python tokenwing-tools/release/build_windows.py `
            --variant "${{ matrix.variant }}" `
            --backend "${{ matrix.backend }}" `
            --out-dir dist `
            @extra

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.variant }}
          path: dist/${{ matrix.variant }}.zip
          if-no-files-found: error

  release:
    name: Verify 13/13 assets and publish release
    needs: [plan, ui, build-linux, build-windows]
    # with from_run the packages not built again come from that run; every build that ran must have passed
    if: ${{ always() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.from_run || (needs.build-linux.result == 'success' && needs.build-windows.result == 'success')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      # the file list step runs a script from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the packages of the earlier run
        if: ${{ inputs.from_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: dist-tokenwing-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}

      - name: Leave out the earlier run's copies of the packages built again
        if: ${{ inputs.from_run && needs.plan.outputs.any == 'true' }}
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          for v in ${VARIANTS//,/ }; do rm -fv "release-assets/$v.tar.gz" "release-assets/$v.zip"; done

      - name: Download the packages built in this run
        if: ${{ needs.plan.outputs.any == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: dist-tokenwing-*
          merge-multiple: true
          path: release-assets

      - name: Verify all 13 packages and generate SHA256SUMS
        run: |
          cd release-assets
          expected=(
            tokenwing-linux-arm64-cpu.tar.gz
            tokenwing-linux-arm64-cuda13.tar.gz
            tokenwing-linux-x64-cpu.tar.gz
            tokenwing-linux-x64-cuda12.tar.gz
            tokenwing-linux-x64-cuda13.tar.gz
            tokenwing-linux-x64-rocm.tar.gz
            tokenwing-linux-x64-vulkan.tar.gz
            tokenwing-windows-arm64-cpu.zip
            tokenwing-windows-x64-cpu.zip
            tokenwing-windows-x64-cuda12.zip
            tokenwing-windows-x64-cuda13.zip
            tokenwing-windows-x64-hip.zip
            tokenwing-windows-x64-vulkan.zip
          )
          for f in "${expected[@]}"; do
            test -s "$f"
          done
          python3 -c '
          import zipfile
          with zipfile.ZipFile("tokenwing-windows-x64-hip.zip") as zf:
              names = zf.namelist()
          assert any(n.startswith("tokenwing/rocblas/library/") for n in names), "Missing rocblas/library in Windows HIP zip"
          assert any(n.startswith("tokenwing/hipblaslt/library/gfx1201/") for n in names), "Missing hipblaslt/library/gfx1201 in Windows HIP zip"
          '

      - name: Engine file list, and the files Hugging Face does not have yet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 -m pip install --no-cache-dir huggingface_hub==2.4.0
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="${INPUT_TAG:-trial-${GITHUB_SHA::9}}"; fi
          # the files are uploaded for a real release and for the trial branch (they are named by their SHA-256, so an
          # upload never changes a file another release uses)
          up=()
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [ "${{ inputs.publish }}" = "true" ] || [ "${GITHUB_REF_NAME}" = "release-trial" ]; then
            up=(--upload runmyai/tokenwing-files)
          fi
          python3 tokenwing-tools/release/engine_files.py release-assets "$TAG" "${up[@]}"

      - name: SHA256SUMS, signed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd release-assets
          sha256sum tokenwing-*.tar.gz tokenwing-*.zip engine-files.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          # the app trusts a checksum only when this signature verifies against the public key built into it
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in SHA256SUMS -out "$RUNNER_TEMP/sig.bin"
          rm -f "$RUNNER_TEMP/key.pem"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > SHA256SUMS.sig
          cat > "$RUNNER_TEMP/pub.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAlShWZZ8GZEQ/xfNza+uGHveSCMOtk+utSJBiE5TyKTw=
          -----END PUBLIC KEY-----
          KEY
          sed -i 's/^ *//' "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" -rawin -in SHA256SUMS -sigfile "$RUNNER_TEMP/sig.bin"

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: tokenwing-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          # gh is told the repository (it needs no checkout for this)
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRE: ${{ inputs.prerelease }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG}"
          fi
          PRE="${INPUT_PRE:-false}"
          case "$TAG" in
            *-*) PRE=true ;;
          esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # a draft: users and the app's update check see it only once it is published by hand, with its notes
            flags=(--target "${{ github.sha }}" --title "$TAG" --generate-notes --draft)
            if [ "$PRE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber release-assets/*
